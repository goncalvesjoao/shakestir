[project]
name = "shakestir-tools"
version = "0.1.0"
description = "Local source snapshot and demo-data utilities"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
snapshot = "scripts.create_snapshot:cli"
seed-build = "scripts.build_demo_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
