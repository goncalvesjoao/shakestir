[project]
name = "shakestir-fastapi"
version = "0.1.0"
description = "ShakeStir ingredient catalog API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.7,<3", "pydantic-settings>=2.7,<3", "alembic>=1.14,<2", "uvicorn[standard]>=0.34,<1"]

[project.scripts]
dev = "scripts.dev:main"
start = "scripts.start:main"
db-migrate = "scripts.db.migrate:migrate"
db-seed = "scripts.db.seed.ingredients:main"
db-setup = "scripts.db.setup:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shakestir", "scripts"]

[tool.fastapi]
entrypoint = "shakestir.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]

[tool.ruff]
target-version = "py311"
